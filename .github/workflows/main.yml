name: integration-tests-app-ci

on:
  push:

permissions:
  contents: read

jobs:
  ios-integration-test:
    # Using macos-26 as per the original issue report
    runs-on: macos-26
    timeout-minutes: 45 # Increased timeout to allow for diagnostics if it hangs
    strategy:
      fail-fast: false
      matrix:
        # Reduced to 5 runs for your initial testing to save minutes
        parameter1: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      # Using FVM config as per the reporter's setup
      - name: Set Flutter version from FVM
        id: fvm-config-action
        uses: kuhnroyal/flutter-fvm-config-action@v3

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}

      - uses: nilsreichardt/simulator-action@v0.6.0
        id: simulator
        with:
          wait_for_boot: true
          model: "iPhone 17"
          boot_retries: "3"
          boot_timeout_seconds: "300"

      - name: Run integration tests
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          # 1. Added a 30s delay to ensure simulator services are fully ready
          echo "Waiting for simulator services to stabilize..."
          sleep 30
          
          # 2. Running with --verbose to capture why the VM Service connection fails
          flutter test integration_test/app_test.dart \
            -d $SIMULATOR_UDID \
            --ignore-timeouts \
            --verbose

      # 3. New step: Collect diagnostics ONLY if the test hangs or fails
      - name: Collect Simulator Diagnostics
        if: failure()
        run: |
          echo "Test failed or timed out. Collecting logs..."
          xcrun simctl diagnose -p --no-archive
          # This creates a folder of logs we can upload as an artifact

      # 4. Upload the logs so you can attach them to the GitHub Issue
      - name: Upload Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-diagnostics-${{ matrix.parameter1 }}
          path: /tmp/simctl_diagnose_*.tar.gz