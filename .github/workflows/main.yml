name: integration-tests-app-ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-integration-test:
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        parameter1: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Set Flutter version from FVM
        id: fvm-config-action
        uses: kuhnroyal/flutter-fvm-config-action@fcdb62b682dade6f0d9e0c6eae6acc647ca8c31d

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}

      - name: Boot Simulator
        uses: nilsreichardt/simulator-action@a7ad1bffe28e5354a2bce14fd9fe2ad125fc99bf
        id: simulator
        with:
          wait_for_boot: true
          model: "iPhone 17"
          boot_retries: "3"
          boot_timeout_seconds: "300"

      - name: Run integration tests
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          flutter test integration_test/app_test.dart \
            -d $SIMULATOR_UDID \
            --ignore-timeouts \
            --verbose

      - name: Collect Simulator Diagnostics
        if: failure()
        run: |
          echo "Test failed or timed out. Collecting logs..."
          xcrun simctl diagnose -p --no-archive
          # Move the generated tarball to /tmp/ for the next step to find it
          mv ~/Desktop/simctl_diagnose_*.tar.gz /tmp/ || true

      - name: Upload Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-diagnostics-${{ matrix.parameter1 }}
          path: /tmp/simctl_diagnose_*.tar.gz